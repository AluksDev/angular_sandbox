<h1 mat-dialog-title>{{ data.title }}</h1>
<div mat-dialog-content>
  <p>{{ data.text }}</p>
</div>
<div mat-dialog-actions class="text-right justify-end items-center flex">
  <button i18n mat-button [mat-dialog-close]="false">No</button>
  <button
    i18n
    mat-button
    [mat-dialog-close]="true"
    id="dialog_confirm"
    mat-raised-button
    color="accent"
    cdkFocusInitial
  >
    Si
  </button>
</div>
