<h1 mat-dialog-title class="text-xl font-bold p-5">{{ data.title }}</h1>
<div mat-dialog-content>
  @if (data.text) {
    <p>{{ data.text }}</p>
  }
  @if (data.html) {
    <p [innerHTML]="data.html"></p>
  }
  @if (data.warnings) {
    <ul class="warnings">
      @for (w of data.warnings; track w) {
        <li>{{ w }}</li>
      }
    </ul>
  }
</div>
<div mat-dialog-actions class="text-right justify-end items-center flex">
  <button i18n mat-button [mat-dialog-close]="true" mat-raised-button color="primary" cdkFocusInitial>Acceptar</button>
</div>
