<h2 mat-dialog-title>Create User</h2>
<mat-dialog-content>
  <form [formGroup]="createUser" class="flex flex-wrap gap-4 pt-4">
    <div class="flex flex-col gap-4">
        <app-form-input-component 
            formControlName="username"
            type="text"
            [required]="true"
            label="Username"
            placeholder="Insert username"
        />
        <app-form-input-component 
            formControlName="email"
            type="email"
            [required]="true"
            label="Email"
            placeholder="Insert email"
        />
        <app-form-input-component 
            formControlName="password"
            type="password"
            [required]="true"
            label="Password"
            placeholder="Insert password"
            minLength="8"
            [validPattern]="passwordPattern"
        />
    </div>
    <div class="flex flex-col gap-4">
        <app-form-input-component 
            formControlName="firstName"
            type="text"
            [required]="true"
            label="First name"
            placeholder="Insert first name"
        />
        <app-form-input-component 
            formControlName="lastName"
            type="text"
            [required]="true"
            label="Last name"
            placeholder="Insert last name"
        />
        @let departments = (departments$ | async);
        <app-form-select-component 
            formControlName="department"
            label="Select department"
            [options]="departments"
            placeholder="Pick one department"
        />
        <app-form-select-component 
            formControlName="role"
            label="Select role"
            [options]="[{value: 'admin', label: 'Admin'}, {value: 'user', label: 'User'}]"
            placeholder="Pick one role"
            [required]="true"
        />
    </div>
  </form>
</mat-dialog-content>
<app-password-generator-component />
<mat-dialog-actions class="flex justify-end items-center gap-2">
  <button mat-button mat-dialog-close>Cancel</button>
  <button mat-flat-button>Create User</button>
</mat-dialog-actions>
