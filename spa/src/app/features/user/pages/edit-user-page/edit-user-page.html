<div class="min-h-screen bg-gray-50 py-12 px-4 sm:px-6 lg:px-8">
    <div class="max-w-3xl mx-auto bg-white rounded-xl shadow-lg">
        <div class="bg-indigo-600 px-8 py-6">
            <h2 class="text-2xl font-bold text-white">Edit User</h2>
            <p class="text-indigo-100 text-sm">Update profile details.</p>
        </div>

        <form class="p-8 space-y-6" [formGroup]="userForm">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                    <app-form-input-component 
                        formControlName="first_name"
                        type="text"
                        label="First name"
                        [required]="false"
                    />
                </div>
                <div>
                    <app-form-input-component 
                        formControlName="last_name"
                        type="text"
                        label="Last name"
                        [required]="false"
                    />                
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                    <app-form-input-component
                        matTooltip="Username can not be changed"
                        matTooltipPosition="above"
                        matTooltipClass="bg-[#2F3033]"
                        [matTooltipHideDelay]="500"
                        formControlName="username"
                        type="text"
                        label="Username"
                        [required]="false"
                    />
                </div>
                <div>
                    <app-form-input-component 
                        formControlName="email"
                        type="email"
                        label="Email"
                        [required]="false"
                    />      
                </div>
            </div>

            <div>
                <app-form-select-component 
                    formControlName="department"
                    label="Department"
                    [required]="false"
                    placeholder="Change department"
                />
            </div>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-6 items-end">
                <div>
                    <mat-slide-toggle class="bg-transparent" labelPosition="before">Account active</mat-slide-toggle>
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-1">Date Joined</label>
                    <div class="w-full px-4 py-2 bg-gray-50 border border-solid border-black-500 rounded-lg text-gray-600 text-sm">{{ userDetails().date_joined | date: 'short' }}</div>
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-1">Last Login</label>
                    <div class="w-full px-4 py-2 bg-gray-50 border border-solid border-black-500 rounded-lg text-gray-600 text-sm">{{ userDetails().last_login | date: 'short' }}</div>
                </div>
            </div>

            <div class="pt-4 border-t border-gray-100">
                <label class="block text-sm font-semibold text-gray-700 mb-3">Assigned Roles</label>
                <div class="flex flex-wrap gap-2">
                <span class="inline-flex items-center px-3 py-1 rounded-full text-sm font-medium bg-indigo-100 text-indigo-800 border border-indigo-200">
                    Administrator
                    <button type="button" class="ml-2 text-indigo-400 hover:text-indigo-600">×</button>
                </span>
                <span class="inline-flex items-center px-3 py-1 rounded-full text-sm font-medium bg-indigo-100 text-indigo-800 border border-indigo-200">
                    Manager
                    <button type="button" class="ml-2 text-indigo-400 hover:text-indigo-600">×</button>
                </span>
                <button type="button" class="inline-flex items-center px-3 py-1 rounded-full text-sm font-medium border border-dashed border-gray-300 text-gray-500 hover:border-indigo-500 hover:text-indigo-500 transition">
                    + Add Role
                </button>
                </div>
            </div>

            <div class="pt-6 flex items-center justify-end space-x-4 border-t border-gray-100">
                <button mat-button>Cancel</button>
                <button mat-flat-button>
                Save Changes
                </button>
            </div>
        </form>
    </div>
</div>
