<div class="flex flex-col md:flex-row md:items-center justify-between gap-6 p-6 bg-white border border-slate-200 rounded-2xl shadow-sm">
    <div class="flex flex-col items-center gap-5 md:flex-row">
        <div class="relative flex-shrink-0">
            <app-avatar-component
                [initials]="initials()"
                sizePreset="xl"
                [id]="userId()"
            />
        </div>

        <div class="flex flex-col gap-1">
            <div class="flex items-center gap-3">
                <h3 class="text-2xl font-bold text-slate-900 tracking-tight leading-none">
                    {{ fullName() ? fullName() : 'NO NAME REGISTERED' }}
                </h3>
                
                <span [ngClass]="is_active 
                    ? 'bg-emerald-50 text-emerald-700 ring-emerald-600/20' 
                    : 'bg-slate-100 text-slate-600 ring-slate-500/10'"
                    class="inline-flex items-center rounded-md px-2 py-1 text-xs font-medium ring-1 ring-inset">
                    {{ is_active ? 'Active' : 'Inactive' }}
                </span>
            </div>
            
            <p class="text-sm font-medium text-blue-600">&#64;{{ username() }}</p>
            <p class="text-sm text-slate-500 flex items-center gap-1">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
                </svg>
                {{ email() }}
            </p>
        </div>
    </div>

    @if (canEdit()){
        <div class="flex items-center gap-3 border-t md:border-t-0 pt-4 md:pt-0">
            <button [routerLink]="['edit']" mat-flat-button color="primary" class="!rounded-lg !px-5 !py-2 shadow-sm transition-all hover:shadow-md">
                <div class="flex items-center gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor">
                        <path d="M13.586 3.586a2 2 0 112.828 2.828l-.793.793-2.828-2.828.793-.793zM11.379 5.793L3 14.172V17h2.828l8.38-8.379-2.83-2.828z" />
                    </svg>
                    Edit Profile
                </div>
            </button>
        </div>
    }
    
</div>
