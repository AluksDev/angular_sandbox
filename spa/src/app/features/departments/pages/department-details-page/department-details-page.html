<div class="min-h-screen bg-gray-50 p-6 font-sans text-gray-900">
    <!-- Breadcrumbs -->
    <app-breadcrumb-component 
        [lastCrumb]="departmentDetails().name"
    />

    <!-- Header Section -->
    <header class="mb-8 flex items-center justify-between">
        <div class="flex items-center gap-5">
        <!-- Big Icon -->
        <div class="flex h-16 w-16 items-center justify-center rounded-2xl bg-blue-600 text-white shadow-lg shadow-blue-200">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="currentColor" viewBox="0 -960 960 960">
                <path [attr.d]="icons[departmentDetails().code]?.path" />
            </svg>
        </div>
        <div>
            <h2 class="text-3xl font-bold tracking-tight text-gray-900">{{ departmentDetails().name }}</h2>
            <p class="text-sm font-mono text-gray-500 uppercase tracking-widest">{{ departmentDetails().code }}</p>
        </div>
        </div>
        
        <a
            [routerLink]="['/departments']"
            class="flex items-center justify-center gap-2 px-4 py-2 rounded-lg bg-blue-600 text-white font-medium shadow-sm hover:bg-blue-700 hover:shadow-md transition-all duration-200"
        >
            <mat-icon>arrow_back</mat-icon>
            <span>Back to departments</span>
        </a>
    </header>

    <div class="grid grid-cols-1 gap-6 lg:grid-cols-3">
        <!-- Info Card -->
        <aside class="space-y-6">
        <div class="rounded-2xl border border-gray-100 bg-white p-6 shadow-sm">
            <h3 class="mb-4 text-xs font-semibold uppercase tracking-wider text-gray-400">Department Details</h3>
            <dl class="space-y-4">
            <div>
                <dt class="text-sm text-gray-500">Name</dt>
                <dd class="text-lg font-medium">{{ departmentDetails().name }}</dd>
            </div>
            <div>
                <dt class="text-sm text-gray-500">Code</dt>
                <dd class="inline-flex items-center rounded-md bg-gray-100 px-2 py-1 text-xs font-mono font-bold text-gray-600">{{ departmentDetails().code }}</dd>
            </div>
            <div>
                <dt class="text-sm text-gray-500">Number of users</dt>
                <dd class="text-3xl font-bold text-blue-600">{{ totalUsers() }}</dd>
            </div>
            </dl>
        </div>
        </aside>

        <!-- Users Section -->
        <main class="lg:col-span-2">
        <section class="rounded-2xl border border-gray-100 bg-white shadow-sm overflow-hidden">
            <div class="border-b border-gray-50 px-6 py-4">
                <h2 class="font-semibold text-gray-800">Users in this department</h2>
            </div>
            <app-table-component 
                [dataSource]="users()"
                [columns]="usersListConfig"
                [totalElements]="totalUsers()"
                [clickableRow]="true"
                emptyMessage="No users in this department"
                (pageChange)="onPageChange($event)"
                (rowClick)="OnRowClick($event)"
                [loading]="loadingUsers()"
            />
        </section>
        </main>
    </div>
</div>
