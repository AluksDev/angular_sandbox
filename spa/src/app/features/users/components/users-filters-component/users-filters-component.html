<form 
  [formGroup]="filterForm" 
  class="flex flex-col gap-4 md:flex-row md:items-end md:gap-6"
>
  
  <!-- Search -->
  <div class="w-full md:flex-1">
    <app-form-input-component 
      formControlName="search"
      type="text"
      label="Search user by name, username, email"
      [required]="false"
      iconName="search"
    />
  </div>

  <!-- Filters -->
  <div class="flex flex-col gap-4 w-full md:w-auto md:flex-row md:items-end">
    
    <div class="w-full md:w-56">
      <app-form-select-component 
        formControlName="department"
        label="Department filter"
        placeholder="Select a department"
        [options]="depSelectOptions()"
        [searchable]="true"
      />
    </div>

    <div class="w-full md:w-48">
      <app-form-select-component 
        formControlName="status"
        label="Status filter"
        placeholder="Select a status"
        [options]="[
          {label: 'All', value: 'all'}, 
          {label: 'Active', value: 'active'}, 
          {label: 'Inactive', value: 'inactive'}
        ]"
      />
    </div>

  </div>
</form>

<!-- Active filters -->
<mat-chip-set class="my-3 flex flex-wrap gap-2">
  @for (filter of activeFilters(); track filter.key){
    <mat-chip 
      (click)="removeFilter(filter.key)" 
      class="border border-solid cursor-pointer text-sm"
    >
      {{ filter.label }}
    </mat-chip>
  }
</mat-chip-set>
