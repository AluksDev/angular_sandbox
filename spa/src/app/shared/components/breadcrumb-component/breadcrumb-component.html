<nav class="flex px-5 py-3 text-gray-700 border border-gray-200 rounded-lg bg-gray-50" aria-label="Breadcrumb">
    <ol class="inline-flex items-center space-x-1 md:space-x-3">
        @for (crumb of crumbs(); track crumb; let last = $last) {
        <li class="inline-flex items-center">
            @if (!last) {
            <div class="flex items-center">
                <a [routerLink]="['/', crumb]" class="text-sm font-medium text-gray-700 hover:text-blue-600 transition-colors">
                {{ crumb | titlecase }}
                </a>
                <svg class="w-3 h-3 mx-2 text-gray-400" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 6 10">
                <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m1 9 4-4-4-4"/>
                </svg>
            </div>
            } @else {
            <span class="text-sm font-medium text-gray-500 md:ml-1">
                {{ lastCrumb() ? lastCrumb() : crumb }}
            </span>
            }
        </li>
        }
    </ol>
</nav>
