<mat-form-field>
    <mat-label>{{ label() }}</mat-label>
    <mat-select 
        [value]="value"
        (selectionChange)="onChange($event.value)"
        (blur)="onTouched()"
        [disabled]="isDisabled"
    >
      @for (option of options(); track option) {
        <mat-option [value]="option">{{option}}</mat-option>
      }
    </mat-select>
</mat-form-field>

<p>{{ options() | json }}</p>
