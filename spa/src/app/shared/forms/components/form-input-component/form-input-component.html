<mat-form-field [appearance]="appearance()" class="w-full py-1 px-2">
  @if (label()){
    <mat-label>{{ label() }}</mat-label>
  }
  <input
    #inputElement
    matInput
    [formControl]="formControl"
    [type]="inputType()"
    [placeholder]="placeholder()"
    [required]="required()"
    [attr.minlength]="minLength()"
    [attr.maxlength]="maxLength()"
    [attr.data-cy]="dataCy()"
  />
  @if (iconName()){
    <mat-icon matPrefix>{{ iconName() }}</mat-icon>
  }
  @if (hint()) {
    <mat-hint>{{ hint() }}</mat-hint>
  }

  @if (type() === 'password'){
     <mat-icon matSuffix class="cursor-pointer" (click)="togglePassword()">{{ eyeIcon() }}</mat-icon>
  }

  @if (type() === 'password' && pswStrengthCheck()){
    <app-password-strength-component 
      [password]="inputElement.value"
    />
  }
  <mat-error>{{ getErrorMessage() }}</mat-error>
</mat-form-field>
