<mat-form-field appearance="outline">
  <mat-label>{{ label() }}</mat-label>
  
  <input
    matInput
    [type]="type()"
    [formControl]="control()"
    [placeholder]="placeholder()"

  />

  @if (hint()) {
    <mat-hint>{{ hint() }}</mat-hint>
  }
  <mat-error>{{ getErrorMessage() }}</mat-error>
</mat-form-field>
