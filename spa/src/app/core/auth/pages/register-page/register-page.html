<div>
    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
        <div>
            <app-form-input-component
                formControlName="username"
                label="Username"
                placeholder="Enter your username"
                [required]="true"
                hint="Your unique username"
                type="text"
                minLength="2"
            />
        </div>
        <div>
            <app-form-input-component
                formControlName="email"
                label="Email"
                placeholder="Enter your email"
                [required]="true"
                hint="Your email"
                [maxLength]="50"
                type="email"
            />
        </div>
        <div>
            <app-form-input-component
                formControlName="password"
                label="Password"
                placeholder="Enter your password"
                [required]="true"
                hint="Your unique password"
                [maxLength]="50"
                type="password"
            />
        </div>
        <div>
            <button mat-flat-button>Register</button>
        </div>
    </form>

<pre>
    <p>isvalid?</p>
    {{ registerForm.valid }}
    <p>Username errors</p>
    {{ registerForm.controls['username'].errors | json}}
    <p>email errors</p>
    {{ registerForm.controls['email'].errors | json}}
    <p>password errors</p>
    {{ registerForm.controls['password'].errors | json}}
</pre>
</div>
