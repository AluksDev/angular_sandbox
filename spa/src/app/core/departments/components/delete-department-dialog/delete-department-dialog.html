<div class="dialog-container">
    @if (loading()){
        <mat-spinner></mat-spinner>
    } @else {
        <div class="dialog-header">
            <h2 class="dialog-title">Delete Department</h2>
            <mat-icon class="status-icon">report_problem</mat-icon>
        </div>

        <div class="dialog-body">
            <p>
                You are about to delete <strong>{{ dep.name }}</strong>. 
                This action cannot be undone and may affect associated employees.
            </p>
        </div>

        <div class="dialog-actions">
            <button mat-stroked-button mat-dialog-close>
                Cancel
            </button>
            <button mat-flat-button class="danger-btn" (click)="onDeleteConfirm()">
                Delete Department
            </button>
        </div>
    }
</div>
