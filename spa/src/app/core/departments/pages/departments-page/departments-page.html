<section>
    <h1>Departments</h1>
    <div class="flex justify-start items-center mx-4">
        <button mat-flat-button (click)="openAddDepDialog()">Add Department</button>
    </div>
    @if (totalDeps() === 0){
        <p>No Departments</p>
    } @else {
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4">
            @for (department of departments(); track department.id){
                <app-department-card-component 
                    [department]="department"
                    (action)="onDepCardAction($event)"
                />
            }
        </div>
    }
</section>
