<form [formGroup]="usersForm" class="flex justify-between items-center">
  <div class="flex-1">
    <app-form-input-component 
      formControlName="searchTerm"
      type="text"
      label="Search user by name, usernamer email"
      [required]="false"
      iconName="search"
      appearance="fill"
    />
    </div>
    <div class="flex justify-between items-center">
      <app-form-select-component 
        formControlName="department"
        label="Department filter"
        placeholder="Select a department"
        [options]="['IT', 'HR', 'Finance', 'Marketing']"
        [searchable]="true"
      />
      <app-form-select-component 
        formControlName="status"
        label="Status filter"
        placeholder="Select a status"
        [options]="['Active', 'Inactive']"
      />
    </div>
</form>
  

<table mat-table [dataSource]="dataSource" class="mat-elevation-z8 w-full overflow-auto">

  <!-- Avatar -->
  <ng-container matColumnDef="avatar">
    <th mat-header-cell *matHeaderCellDef> </th>
    <td mat-cell *matCellDef="let element">
      <div class="w-10 h-10 rounded-full bg-gray-400 text-white flex items-center justify-center">
        {{ getInitials(element.fullName) }}
      </div>
    </td>
  </ng-container>

  <!-- Full Name -->
  <ng-container matColumnDef="fullName">
    <th mat-header-cell *matHeaderCellDef> Full Name </th>
    <td mat-cell *matCellDef="let element"> {{ element.fullName }} </td>
  </ng-container>

  <!-- Username -->
  <ng-container matColumnDef="username">
    <th mat-header-cell *matHeaderCellDef> Username </th>
    <td mat-cell *matCellDef="let element"> {{ element.username }} </td>
  </ng-container>

  <!-- Email -->
  <ng-container matColumnDef="email">
    <th mat-header-cell *matHeaderCellDef> Email </th>
    <td mat-cell *matCellDef="let element"> {{ element.email }} </td>
  </ng-container>

  <!-- Department -->
  <ng-container matColumnDef="department">
    <th mat-header-cell *matHeaderCellDef> Department </th>
    <td mat-cell *matCellDef="let element"> {{ element.department }} </td>
  </ng-container>

  <!-- Status -->
  <ng-container matColumnDef="status">
    <th mat-header-cell *matHeaderCellDef> Status </th>
    <td mat-cell *matCellDef="let element">
      <span
        class="px-2 py-1 rounded text-white text-sm"
        [ngClass]="{
          'bg-green-500': element.status === 'active',
          'bg-red-500': element.status === 'inactive'
        }"
      >
        {{ element.status }}
      </span>
    </td>
  </ng-container>

  <!-- Actions -->
  <ng-container matColumnDef="actions">
    <th mat-header-cell *matHeaderCellDef> Actions </th>
    <td mat-cell *matCellDef="let element">
      <button mat-button color="primary">Details</button>
      <button mat-button color="accent">Edit</button>
      <button mat-button color="warn">Deactivate</button>
    </td>
  </ng-container>

  <!-- Rows -->
  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
</table>
