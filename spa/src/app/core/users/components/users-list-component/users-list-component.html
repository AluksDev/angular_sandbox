@if (dataSource().data.length !== 0) {
  <table 
    mat-table 
    [dataSource]="dataSource()" 
    matSort 
    class="mat-elevation-z8 w-full overflow-auto" 
    (matSortChange)="onSortChange($event)"
  >
    <!-- Avatar -->
    <ng-container matColumnDef="avatar">
      <th mat-header-cell *matHeaderCellDef> </th>
      <td mat-cell *matCellDef="let element">
        <div class="w-10 h-10 rounded-full bg-gray-400 text-white flex items-center justify-center">
          {{ getInitials(element.fullName) }}
        </div>
      </td>
    </ng-container>

    <!-- Full Name -->
    <ng-container matColumnDef="fullName">
      <th mat-header-cell *matHeaderCellDef mat-sort-header> Full Name </th>
      <td mat-cell *matCellDef="let element"> {{ element.fullName }} </td>
    </ng-container>

    <!-- Username -->
    <ng-container matColumnDef="username">
      <th mat-header-cell *matHeaderCellDef mat-sort-header> Username </th>
      <td mat-cell *matCellDef="let element"> {{ element.username }} </td>
    </ng-container>

    <!-- Email -->
    <ng-container matColumnDef="email">
      <th mat-header-cell *matHeaderCellDef mat-sort-header> Email </th>
      <td mat-cell *matCellDef="let element"> {{ element.email }} </td>
    </ng-container>

    <!-- Department -->
    <ng-container matColumnDef="department">
      <th mat-header-cell *matHeaderCellDef mat-sort-header> Department </th>
      <td mat-cell *matCellDef="let element"> 
        {{ departmentMap()[element.department] }} 
      </td>
    </ng-container>

    <!-- Status -->
    <ng-container matColumnDef="status">
      <th mat-header-cell *matHeaderCellDef mat-sort-header> Status </th>
      <td mat-cell *matCellDef="let element">
        <span
          class="px-2 py-1 rounded text-white text-sm"
          [ngClass]="{
            'bg-green-500': element.status === 'active',
            'bg-red-500': element.status === 'inactive'
          }"
        >
          {{ element.status }}
        </span>
      </td>
    </ng-container>

    <!-- Actions -->
    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef> Actions </th>
      <td mat-cell *matCellDef="let element">
        <button mat-button color="primary">Details</button>
        <button mat-button color="accent">Edit</button>
        <button mat-button color="warn">Deactivate</button>
      </td>
    </ng-container>

    <!-- Rows -->
    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr 
      mat-row 
      *matRowDef="let row; columns: displayedColumns;" 
      [ngClass]="{'opacity-60': row.status === 'inactive'}"
    ></tr>
  </table>

  <mat-paginator 
    [length]="totalUsers()"
    [pageSizeOptions]="[10, 25, 50, 100]"
    showFirstLastButtons
    aria-label="Select page of periodic elements"
    (page)="onPageChange($event)"
  />
} @else {
  <p class="flex justify-center items-center text-3xl">No users found</p>
}
