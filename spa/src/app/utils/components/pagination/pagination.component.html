


<section class="flex gap-4 items-center justify-center">

    @if (currentPage() != 1) {
        <button 
        class="btn btn-primary"
        (click)="increase(-1)"
        >Página Anterior</button>
    }

    @if (currentPage() != pages() && pages() != 0) {
        <button 
        class="btn btn-primary"
        (click)="increase(1)"
        >Siguiente Página</button>
    }
</section>
