<h2 mat-dialog-title class="text-center">{{ data.title }}</h2>

<mat-dialog-content class="dialog-success-content">
  
  @if ( data.success ) {
    <mat-icon class="icon success-icon">check_circle</mat-icon>
  }

  @else {
    <mat-icon class="icon error-icon">error</mat-icon>
  }

  <p>{{ data.message }}</p>

</mat-dialog-content>
