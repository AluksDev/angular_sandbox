<!-- Wrapper -->
<div class="flex flex-col w-full">
  <div
    class="absolute inset-0 p-1 flex flex-col min-w-0 overflow-hidden bg-default dark:bg-transparent"
    [ngClass]="{
      'p-1': showBreadcrumbs(),
    }">
    <!-- Header -->
    @if (showBreadcrumbs()) {
      <div class="flex flex-col px-4 py-2 pl-8 sm:flex-row flex-0 sm:items-center sm:justify-between">
        <div class="flex-1 min-w-0">
          <!-- Breadcrumbs -->
          <div class="inline-flex items-center">
            <!-- <button
              mat-icon-button
              class="inline-flex items-center -ml-1.5 text-secondary font-medium bg-white mr-2"
              (click)="location.back()">
              <mat-icon
                class="icon-size-5 text-secondary"
                [svgIcon]="'heroicons_solid:chevron-left'"></mat-icon>
              <span class="ml-1">Tornar</span>
            </button> -->
            <div class="inline-flex items-center text-sm font-medium">
              @for (breadcrumb of breadcrumbs() ?? []; track $index) {
                <div>
                  @if (breadcrumb.url) {
                    <a
                      class="whitespace-nowrap text-primary-500 no-underline"
                      [ngClass]="{ 'text-primary-500': $index === 0, 'text-gray-500': $index !== 0 }"
                      [href]="breadcrumb.url"
                      >{{ breadcrumb.label }}</a
                    >
                  }
                  @if (!breadcrumb.url) {
                    <span
                      class="whitespace-nowrap text-primary-500 no-underline"
                      [ngClass]="{ 'text-primary-500': $index === 0, 'text-gray-500': $index !== 0 }"
                      >{{ breadcrumb.label }}</span
                    >
                  }
                  @if ($index < (breadcrumbs()?.length ?? 0) - 1) {
                    <span class="mx-2">{{ "/" }}</span>
                  }
                </div>
              }
            </div>
          </div>
          <!-- Title -->
          <div class="mt-2">
            <h2 class="text-xl md:text-4xl font-extrabold truncate m-0">{{ showTitle() }}</h2>
          </div>
        </div>
      </div>
    }
    <app-header></app-header>
    <div
      class="overflow-y-auto m-2 mb-20"
      [ngClass]="{
        'p-2 sm:p-4 flex-auto bg-card shadow': showBreadcrumbs(),
      }"
      cdkScrollable>
      <router-outlet></router-outlet>
    </div>

    <!-- Footer -->
    <!--    <div-->
    <!--        class="bg-card relative z-49 flex h-14 w-full flex-0 items-center justify-start border-t px-4 dark:bg-transparent md:px-6 print:hidden"-->
    <!--    >-->
    <!--        <span class="text-secondary font-medium"-->
    <!--            >Fuse &copy; {{ currentYear }}</span-->
    <!--        >-->
    <!--    </div>-->
  </div>
</div>
