<div class="form-container">
    <form class="app-form" [formGroup]="departmentForm">
        
        <div class="form-field-group">
            <label for="name">Nombre del Departamento</label>
            <input 
                type="name" 
                id="name"
                placeholder="Ventas, Marketing, etc."
                formControlName="name">
            
                @if (formUtils.isNotValidField(departmentForm, "name")) {
                    <span class="error-message">
                        {{formUtils.getFieldError(departmentForm, "name")}}
                    </span>
                }
        </div>

        <div class="form-field-group">
            <label for="code">Código (Alfanumérico)</label>
            <input 
                type="text" 
                id="code"
                placeholder="Ej: VNT001"
                formControlName="code">
            
                @if (formUtils.isNotValidField(departmentForm, "code")) {
                    <span class="error-message">
                        {{formUtils.getFieldError(departmentForm, "code")}}
                    </span>
                }
        </div>
    </form>
</div>
