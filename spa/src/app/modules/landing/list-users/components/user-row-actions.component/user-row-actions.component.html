<div class="flex space-x-2 justify-center">
    
    <a 
        title="Editar usuario"
        class="text-indigo-600 hover:text-indigo-900 p-1 rounded-full cursor-pointer">
        <!-- TODO edit user -->
        <mat-icon 
            class="w-5 h-5 text-indigo-600"  svgIcon="heroicons_mini:pencil" 
            aria-label="Editar">
        </mat-icon>
    </a>

    <button 
        title="Desactivar usuario"
        class="bg-transparent border-none text-red-600 hover:text-red-900 p-1 rounded-full cursor-pointer"
        (click)="handleClick()"
        >
        @if (user().is_active) {
            <mat-icon 
                class="w-5 h-5 text-red-600"  svgIcon="heroicons_mini:trash" 
                aria-label="Desactivar">
            </mat-icon>
        }

        @else {
            <mat-icon 
                class="w-5 h-5 text-green-600"  svgIcon="heroicons_mini:check" 
                aria-label="Activar">
            </mat-icon>
        }
    </button>

</div>
