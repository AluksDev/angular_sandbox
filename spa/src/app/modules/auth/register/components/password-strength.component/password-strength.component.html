<div class="w-full mt-2">
    <div class="flex h-2 rounded-full overflow-hidden bg-gray-200">
        <div 
            class="h-full transition-all duration-300 ease-in-out"
            [ngClass]="{
                'bg-red-500': strength >= 1 && barColor === 'red',
                'bg-orange-400': strength >= 1 && barColor === 'orange',
                'bg-yellow-400': strength >= 1 && barColor === 'yellow',
                'bg-green-500': strength >= 1 && barColor === 'green'
            }"
            [style.width.%]="strength >= 1 ? 25 : 0"
        ></div>
        
        <div 
            class="h-full transition-all duration-300 ease-in-out ml-0.5"
            [ngClass]="{
                'bg-red-500': strength >= 2 && barColor === 'red',
                'bg-orange-400': strength >= 2 && barColor === 'orange',
                'bg-yellow-400': strength >= 2 && barColor === 'yellow',
                'bg-green-500': strength >= 2 && barColor === 'green'
            }"
            [style.width.%]="strength >= 2 ? 25 : 0"
        ></div>
        
        <div 
            class="h-full transition-all duration-300 ease-in-out ml-0.5"
            [ngClass]="{
                'bg-yellow-400': strength >= 3 && barColor === 'yellow',
                'bg-green-500': strength >= 3 && barColor === 'green'
            }"
            [style.width.%]="strength >= 3 ? 25 : 0"
        ></div>

        <div 
            class="h-full transition-all duration-300 ease-in-out ml-0.5"
            [ngClass]="{
                'bg-green-500': strength >= 4 && barColor === 'green'
            }"
            [style.width.%]="strength >= 4 ? 25 : 0"
        ></div>
    </div>
    
    <p 
        class="mt-1 text-sm font-medium transition-colors duration-300"
        [ngClass]="{
            'text-red-600': barColor === 'red',
            'text-orange-500': barColor === 'orange',
            'text-yellow-600': barColor === 'yellow',
            'text-green-600': barColor === 'green',
            'text-gray-500': barColor === 'gray'
        }"
    >
        {{ message }}
    </p>
</div>
