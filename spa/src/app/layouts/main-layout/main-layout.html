 <div class="flex flex-row w-full min-h-[100vh]">
    <fuse-vertical-navigation
        [navigation]="navigationItems"
        [nameInput]="'mainNavigation'"
        [modeInput]="'side'"
    >

    <!-- Header rendering -->
    <ng-container fuseVerticalNavigationHeader>
        <a routerLink="/" class="no-underline text-inherit">
            <div class="flex items-center p-4 w-fit">
                <div class="relative w-10 h-10 mr-4">
                    
                        <svg class="h-10 w-10 mr-4" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M4.5 22L20 6L35.5 22M20 18L32 30" stroke="#3b82f6" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
                            
                            <rect x="14" x="14" width="12" height="12" fill="#60a5fa" rx="2"/>
                            
                            <rect x="14" x="14" width="12" height="12" fill="#60a5fa" rx="2" style="filter: blur(2px); opacity: 0.5;"/>
                        </svg>
                    
                </div>
                @if (sideBarOpened()){
                    <div class="flex flex-col leading-tight">
                        <span class="text-2xl font-extrabold tracking-wider uppercase">
                            Sandbox
                        </span>
                        <span class="text-[#3b82f6] text-base font-bold">
                            Angular
                        </span>
                    </div>
                }
                
            </div> 
        </a>
        <div class="flex justify-end items-center">
            <span (click)="toggleNavigation('mainNavigation')" class="p-2 bg-gray-200 rounded cursor-pointer hover:bg-gray-100 transition duration-150 ease-in-out">
                <mat-icon>menu</mat-icon>
            </span>
        </div>
    </ng-container>



    <!-- Footer rendering -->
    <ng-container fuseVerticalNavigationFooter *ngIf="user$ | async as user">
        <app-user-sidebar-snippet-component 
            (action)="onUserAction($event)"
            [user]="user"
            [fullSnippet]="sideBarOpened()"
        />
    </ng-container>



    </fuse-vertical-navigation>
    <div class="flex-1 px-6 py-4">
        <router-outlet />
    </div>
 </div>
