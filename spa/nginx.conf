server {
  listen 80;

  gzip on;
  gzip_disable "msie6";
  gzip_comp_level 6;
  gzip_min_length 1100;
  gzip_buffers 16 8k;
  gzip_proxied any;
  gzip_types
      text/plain
      text/css
      text/js
      text/xml
      text/javascript
      application/javascript
      application/json
      application/xml
      application/rss+xml
      image/svg+xml;

  location / {
    root /usr/share/nginx/html;
    index index.html index.htm;
    try_files $uri $uri/ /index.html =404;
  }
  location /nginx/status {
      stub_status on;
      access_log off;
  }
  location /nginx/health {
      add_header Content-Type text/plain;
      return 200 "phg";
      access_log off;
  }
  # volume media files django
  location /media/uploads {
      alias /usr/share/nginx/html/django-media;
  }
}
